baseURL = "https://imflash217.github.io/portfolio/"
languageCode = "en-us"
title = "imflash217"
theme = "PaperMod"
[pagination]
  pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  minifyOutput = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[params]
  env = "production"
  author = "Vinay Kumar"
  description = "Machine Learning Engineer  -  Deep Learning, NLP, Systems"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  hideFooter = false
  TocOpen = true
  ShowWordCount = true

  [params.label]
    text = "imflash217"

  [params.profileMode]
