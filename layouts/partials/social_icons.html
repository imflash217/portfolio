<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{- if eq .name "github" }}<i class="fa-brands fa-github fa-lg"></i>
        {{- else if eq .name "linkedin" }}<i class="fa-brands fa-linkedin fa-lg"></i>
        {{- else if eq .name "twitter" }}<i class="fa-brands fa-x-twitter fa-lg"></i>
        {{- else }}{{ partial "svg.html" . }}
        {{- end }}
    </a>
    {{- end }}
</div>
